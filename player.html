<!DOCTYPE html><html><head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}#p{width:100%;height:100%}</style>
</head><body><div id="p"></div>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
var vid=new URLSearchParams(location.search).get('v'),pl=null;
function send(o){parent.postMessage(o,'*');}
function onYouTubeIframeAPIReady(){
  pl=new YT.Player('p',{videoId:vid,width:'100%',height:'100%',
    playerVars:{playsinline:1,rel:0,modestbranding:1,controls:1,fs:1},
    events:{
      onReady:function(){send({t:'ready'});},
      onStateChange:function(e){send({t:'state',s:e.data});},
      onError:function(e){send({t:'error',c:e.data});}
    }});
}
setInterval(function(){
  if(pl&&pl.getCurrentTime)send({t:'time',v:pl.getCurrentTime()});
},250);
addEventListener('message',function(e){
  var d=e.data||{};if(!pl||!d.t)return;
  if(d.t==='seek')pl.seekTo(d.v,true);
  if(d.t==='rate')pl.setPlaybackRate(d.v);
  if(d.t==='vol')pl.setVolume(d.v);
  if(d.t==='play')pl.playVideo();
});
</script></body></html>
